<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Voice Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
</head>
<body class="dashboard">
    <nav class="navbar glass-panel" style="border-radius: 0; border-top: none; border-left: none; border-right: none;">
        <div class="nav-brand">🎙️ Voice Assistant</div>
        <div class="nav-user">
            <span>Welcome, <strong>{{ user.username }}</strong></span>
            <a href="{{ url_for('logout') }}" class="btn btn-logout">Logout</a>
        </div>
    </nav>
    
    <div class="dashboard-container">
        <!-- Main Interaction Area -->
        <div class="main-interaction glass-panel">
            <h2 style="font-weight: 300; font-size: 2rem; color: #e2e8f0; margin-bottom: 0.5rem;">How can I help you?</h2>
            <div id="status" class="status-text">Click the button below to start</div>
            
            <div class="orb-container">
                <div class="orb-ring"></div>
                <div class="orb-ring-2"></div>
                <div id="neuralOrb" class="orb"></div>
            </div>

            <button id="startBtn" class="btn btn-large">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
                Wake Assistant
            </button>
            
            <div id="result" class="result-box" style="display: none;"></div>
        </div>

        <!-- Sidebar / History -->
        <div class="history-panel glass-panel">
            <div class="history-header" style="padding: 1.5rem 1.5rem 0 1.5rem;">
                <h2>📜 Command History</h2>
                <button id="clearHistoryBtn" class="btn btn-icon" title="Clear History">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                </button>
            </div>
            <ul id="historyList" class="history-list" style="padding: 1.5rem;">
                <!-- History items injected via JS -->
            </ul>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}")
            .then(() => console.log("Service Worker Registered"))
            .catch(err => console.error("Service Worker failed", err));
        }
    </script>
</body>
</html>
